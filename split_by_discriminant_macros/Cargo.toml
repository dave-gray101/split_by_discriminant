[package]
name = "split_by_discriminant_macros"
version = "0.1.0"
edition = "2024"
authors = ["Dave Lee <dave@gray101.com>"]
license = "MIT"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.117", features = ["full"] }
quote = "1"
proc-macro2 = "1"
split_by_discriminant = { path = "../", version = "0.5.1", features = ["proc_macro"] }